[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61", "wheel"]

[project]
name = "executorch-extension-model-explorer"
version = "0.1.0"
description = "Combined Model Explorer extension package for ExecuTorch PTE, ETRecord, and ETDump artifacts"
readme = "README.md"
requires-python = ">=3.10,<3.13"
keywords = ["model-explorer", "executorch", "pte", "etrecord", "etdump", "visualization"]
license = "Apache-2.0"
license-files = ["LICENSE"]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "pte-adapter-model-explorer>=0.1.2",
  "etrecord-adapter-model-explorer>=0.1.0",
  "etdump-data-provider-model-explorer>=0.1.0",
]

[dependency-groups]
dev = [
  "packaging>=24.0",
  "tomlkit>=0.13,<1",
  "pytest==9.0.1",
  "pytest-timeout==2.4.0",
  "ruff==0.14.2",
  "pyright==1.1.407",
  "ai-edge-model-explorer==0.1.32",
  "torch==2.14.0+cpu; sys_platform != 'darwin'",
  "torch==2.14.0; sys_platform == 'darwin'",
]
coverage = [
  "pytest-cov==7.0.0",
]
build = [
  "build==1.3.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
executorch_extension_model_explorer = "src/executorch_extension_model_explorer"

[tool.setuptools.packages.find]
where = [
  "src",
]
include = [
  "executorch_extension_model_explorer*",
]

[tool.pyright]
include = [
  "src",
]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = [
  "src",
]
testpaths = [
  "tests/shared",
  "tests/release",
]

[tool.ruff]
line-length = 79
target-version = "py312"
exclude = [
  "build",
]

[tool.ruff.lint]
select = [
  "F",
  "B",
  "I",
  "SIM",
  "C4",
]

[tool.coverage.run]
omit = [
  "*/test_*",
  "*/config.py",
  "*/__init__.py",
  "*/executorch_flatbuffer/*",
]
