name: Update dependency lower bound

on:
  workflow_dispatch:
    inputs:
      dependency:
        description: "Dependency package to update"
        required: true
        type: choice
        options:
          - pte-adapter-model-explorer
          - etrecord-adapter-model-explorer
          - etdump-data-provider-model-explorer
      version:
        description: "Release version or tag"
        required: true
        type: string
  repository_dispatch:
    types: [update-dependency, update-submodule]

permissions:
  contents: read

jobs:
  update:
    name: Update dependency lower bound
    if: github.repository == 'Arm-Debug/executorch-extension-model-explorer'
    runs-on: ubuntu-latest
    steps:
      - uses: getsentry/action-github-app-token@d4b5da6c5e37703f8c3b3e43abb5705b46e159cc # v3.0.0
        id: get_app_token
        with:
          app_id: ${{ secrets.ME_REPO_ACCESS_APP_ID }}
          private_key: ${{ secrets.ME_REPO_ACCESS_PRIVATE_KEY }}

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ steps.get_app_token.outputs.token }}
          ref: main
          persist-credentials: false

      - name: Configure git
        run: |
          git config --global user.email "1736931+model-explorer-plugins-repo-access[bot]@users.noreply.github.com"
          git config --global user.name "model-explorer-plugins-repo-access[bot]"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependency update tools
        run: python -m pip install "packaging>=24.0" "tomlkit>=0.13,<1"

      - name: Resolve request and update dependency
        id: request
        env:
          DISPATCH_DEPENDENCY: ${{ github.event.client_payload.dependency }}
          DISPATCH_SUBMODULE: ${{ github.event.client_payload.submodule }}
          DISPATCH_NAME: ${{ github.event.client_payload.name }}
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
          DISPATCH_REF: ${{ github.event.client_payload.ref }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          INPUT_DEPENDENCY: ${{ inputs.dependency }}
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          dependency="${INPUT_DEPENDENCY:-${DISPATCH_DEPENDENCY:-${DISPATCH_SUBMODULE:-$DISPATCH_NAME}}}"
          version="${INPUT_VERSION:-${DISPATCH_VERSION:-${DISPATCH_REF:-$DISPATCH_TAG}}}"

          python scripts/update-dependency-pin.py "$dependency" "$version" \
            --github-output "$GITHUB_OUTPUT"

      - name: Create pull request
        uses: peter-evans/create-pull-request@67ccf7814544e30c1fbcb3869178934549995817 # v6.1.0
        with:
          token: ${{ steps.get_app_token.outputs.token }}
          branch: update/${{ steps.request.outputs.dependency }}-${{ steps.request.outputs.version }}
          commit-message: "fix(deps): update ${{ steps.request.outputs.dependency }} to ${{ steps.request.outputs.version }}"
          title: "fix(deps): update ${{ steps.request.outputs.dependency }} to ${{ steps.request.outputs.version }}"
          base: main
          add-paths: pyproject.toml
          body: |
            Updates `${{ steps.request.outputs.dependency }}` to `${{ steps.request.outputs.version }}`.

            This raises the dependency lower bound in `pyproject.toml` without dropping other constraints.
            Review the normal PR compatibility checks before merging. This does not tag or publish the umbrella.
