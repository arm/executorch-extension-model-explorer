name: Update dependency lower bound

on:
  workflow_dispatch:
    inputs:
      dependency:
        description: "Dependency package to update"
        required: true
        type: choice
        options:
          - pte-adapter-model-explorer
          - etrecord-adapter-model-explorer
          - etdump-data-provider-model-explorer
      version:
        description: "Clean release version or tag (e.g. v0.1.2)"
        required: true
        type: string
  repository_dispatch:
    types: [update-dependency, update-submodule]

permissions:
  contents: read

jobs:
  update:
    name: Update dependency lower bound
    if: github.repository == 'Arm-Debug/executorch-extension-model-explorer'
    runs-on: ubuntu-latest
    steps:
      - name: Create internal umbrella update token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: get_app_token
        with:
          app-id: ${{ secrets.ME_REPO_ACCESS_APP_ID }}
          private-key: ${{ secrets.ME_REPO_ACCESS_PRIVATE_KEY }}
          owner: Arm-Debug
          repositories: executorch-extension-model-explorer
          permission-contents: write

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ steps.get_app_token.outputs.token }}
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependency update tools
        run: python -m pip install "packaging>=24.0" "tomlkit>=0.13,<1"

      - name: Resolve request and update dependency
        id: request
        env:
          DISPATCH_DEPENDENCY: ${{ github.event.client_payload.dependency }}
          DISPATCH_SUBMODULE: ${{ github.event.client_payload.submodule }}
          DISPATCH_NAME: ${{ github.event.client_payload.name }}
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
          DISPATCH_REF: ${{ github.event.client_payload.ref }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          INPUT_DEPENDENCY: ${{ inputs.dependency }}
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          dependency="${INPUT_DEPENDENCY:-${DISPATCH_DEPENDENCY:-${DISPATCH_SUBMODULE:-$DISPATCH_NAME}}}"
          version="${INPUT_VERSION:-${DISPATCH_VERSION:-${DISPATCH_REF:-$DISPATCH_TAG}}}"

          python scripts/update-dependency-pin.py "$dependency" "$version" \
            --github-output "$GITHUB_OUTPUT"

      - name: Commit dependency update to main
        env:
          GH_TOKEN: ${{ steps.get_app_token.outputs.token }}
          APP_SLUG: ${{ steps.get_app_token.outputs.app-slug }}
          DEPENDENCY: ${{ steps.request.outputs.dependency }}
          VERSION: ${{ steps.request.outputs.version }}
        shell: bash
        run: |
          bot="${APP_SLUG}[bot]"
          bot_id=$(gh api "users/$bot" --jq .id)
          git config user.name "$bot"
          git config user.email "${bot_id}+${bot}@users.noreply.github.com"
          gh auth setup-git
          bash scripts/push-dependency-update.sh "$DEPENDENCY" "$VERSION"
